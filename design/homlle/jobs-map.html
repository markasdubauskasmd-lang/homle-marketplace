<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jobs near you — map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; height: 100%; background: #eceaea; }
  #map { position: absolute; inset: 0; font-family: 'Archivo', system-ui, sans-serif; }
  /* Brand treatment: tiles read as the design system's black-and-white imagery,
     so the only colour on the map is Homlle red. */
  .leaflet-tile-pane { filter: grayscale(1) contrast(1.04); }
  .leaflet-container { background: #eceaea; }
  .leaflet-control-attribution { font-size: 9.5px; font-family: 'Archivo', system-ui, sans-serif; }
  .job-dot {
    display: block; width: 12px; height: 12px; border: 2px solid #fff; border-radius: 50%;
    box-shadow: 0 2px 7px rgba(28,23,22,.3);
  }
  .job-dot.offer { background: #e01030; }
  .job-dot.booked { background: #201e1d; }
  .map-legend {
    padding: 9px 11px; border: 2px solid #201e1d; border-radius: 12px; background: #fff;
    font-size: 11px; font-weight: 700; line-height: 1.5; color: #201e1d;
  }
  .map-legend span { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
  .map-legend i { width: 10px; height: 10px; flex: none; border-radius: 50%; }
  .leaflet-popup-content-wrapper { border-radius: 14px; border: 2px solid #201e1d; }
  .leaflet-popup-content { margin: 12px 14px; font-family: 'Archivo', system-ui, sans-serif; font-size: 12.5px; line-height: 1.45; }
  .leaflet-popup-content strong { display: block; font-size: 13.5px; }
</style>
</head>
<body>
<div id="map" role="application" aria-label="Map of available cleaning jobs in your work areas"></div>
<script>
  // Outward-postcode centroids only — Homlle stores the outward postcode you choose,
  // never a street address, so nothing here is more precise than the sector.
  var BASE = [53.7965, -1.5478];            // LS1, Leeds city centre
  var MILES = 15;
  var JOBS = [
    { at: [53.7996, -1.5454], label: '2 offers · LS1–LS2', kind: 'offer',
      title: '2 offers awaiting your reply',
      meta: 'Regular clean · LS1 · Tue 8 · 13:00 · 2h · £36.00<br>End of tenancy · LS2 · Thu 10 · 10:00 · 5h · £95.00' },
    { at: [53.8180, -1.5760], label: 'LS6 · booked', kind: 'booked',
      title: 'Deep clean · 3 bed house', meta: 'Sun 6 · 09:00 · 3.5h · £68.00 · confirmed' }
  ];

  var map = L.map('map', { center: BASE, zoom: 11, scrollWheelZoom: false, zoomControl: false });
  L.control.zoom({ position: 'bottomleft' }).addTo(map);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  var radius = L.circle(BASE, {
    radius: MILES * 1609.34,
    color: '#e01030', weight: 2, dashArray: '6 5',
    fillColor: '#e01030', fillOpacity: .06
  }).addTo(map);
  radius.bindPopup('<strong>Your work area</strong>LS1, LS2, LS6 · ' + MILES + ' miles maximum travel');

  var CLUSTER = [53.8057, -1.5556];         // mean of the three outward-postcode centroids
  L.marker(CLUSTER, {
    icon: L.divIcon({ className: '', html: '<span class="job-dot offer" aria-hidden="true"></span>', iconSize: [16, 16], iconAnchor: [8, 8] }),
    title: '3 jobs across LS1, LS2 and LS6'
  }).addTo(map).bindPopup(
    '<strong>3 jobs in your work areas</strong>' +
    JOBS.map(function (j) { return j.title + ' — ' + j.meta; }).join('<br>')
  );

  // The 15 miles the page advertises is the frame, whatever size the container is.
  function frameRadius() {
    map.invalidateSize();
    map.fitBounds(radius.getBounds(), { padding: [6, 6] });
  }
  var legend = L.control({ position: 'topright' });
  legend.onAdd = function () {
    var box = L.DomUtil.create('div', 'map-legend');
    box.innerHTML = '<span style="font-weight:800;letter-spacing:.1em;font-size:9.5px">JOBS IN YOUR AREAS</span>' +
      JOBS.map(function (j) { return '<span>' + j.label + '</span>'; }).join('');
    return box;
  };
  legend.addTo(map);

  frameRadius();
  new ResizeObserver(frameRadius).observe(document.getElementById('map'));
</script>
</body>
</html>
