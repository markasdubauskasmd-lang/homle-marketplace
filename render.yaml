# Safe Render staging foundation. The connected PostgreSQL staging database now
# uses Render's durable basic_256mb plan. Marketplace traffic remains closed until
# the database is bootstrapped and every private dependency passes.
services:
  - type: web
    name: homle-marketplace-preview
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: "off"
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node scripts/render-staging-entrypoint.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: HOST
        value: "0.0.0.0"
      - key: LAN_PORT
        value: "0"
      - key: DATA_DIR
        value: "/var/lib/tideway"
      - key: APP_ORIGIN
        value: "https://homlle.com"
      - key: RENDER_STAGING_BOOTSTRAP_ENABLED
        value: "true"
      - key: RENDER_STAGING_BASELINE_MIGRATION_COUNT
        value: "45"
      - key: DATABASE_BOOTSTRAP_URL
        fromDatabase:
          name: homle-marketplace-staging-db
          property: connectionString
      - key: TIDEWAY_APP_PASSWORD
        generateValue: true
      - key: TIDEWAY_WORKER_PASSWORD
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: AUTH_TOKEN_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      # These provider choices are owned by the existing Render service. A
      # Blueprint sync must not replace a tested staging configuration with a
      # source default; new services must set them explicitly in the dashboard.
      - key: MAP_PROVIDER
        sync: false
      - key: GEOCODING_PROVIDER
        sync: false
      - key: ADDRESS_LOOKUP_PROVIDER
        sync: false
      - key: ETA_PROVIDER
        sync: false
      - key: ADMIN_REQUIRE_KEY
        value: "true"
      - key: ADMIN_KEY
        generateValue: true
      - key: TRUST_PROXY
        value: "true"
      - key: TRUST_PROXY_PROVIDER
        value: "render"
      - key: TRUSTED_PROXY_CIDRS
        value: ""
      - key: MARKETPLACE_ADAPTER_MODULE
        value: "homle:render-log-monitoring"
      - key: RENDER_LOG_MONITORING_ACKNOWLEDGED
        value: "true"
      - key: PILOT_INTAKE_ENABLED
        value: "false"
      - key: AUTHENTICATION_ENABLED
        value: "true"
      # Restricted staging activation is an operator-owned runtime decision.
      # Public launch attestations below remain source-controlled and false.
      - key: MARKETPLACE_ENABLED
        sync: false
      - key: PUBLIC_MARKETPLACE_APPROVED
        value: "false"
      - key: LEGAL_BUSINESS_READY
        value: "false"
      - key: INSURANCE_READY
        value: "false"
      - key: CLEANER_SUPPLY_READY
        value: "false"
      - key: PRICING_POLICY_APPROVED
        value: "false"
      - key: CUSTOMER_SUPPORT_READY
        value: "false"
      - key: CUSTOMER_TERMS_READY
        value: "false"
      - key: STAGING_ACCOUNTS_ONLY
        value: "true"
      # The free preview has no separate paid background-worker service. Run
      # exactly one supervised worker set inside this single web process so
      # explicitly authorised Cleaner matching can progress between requests.
      - key: MARKETPLACE_INLINE_WORKERS
        value: "true"
      - key: MARKETPLACE_WORKER_ENABLED
        value: "true"
      # Email delivery is an operator-controlled launch gate. Keep it disabled
      # in Render until the verified sender, signed suppression webhook and
      # monitored staging delivery have all passed, then preserve that explicit
      # dashboard decision across later Blueprint syncs.
      - key: WORKER_EMAIL_ENABLED
        sync: false
      - key: WORKER_MEDIA_ENABLED
        value: "false"
      - key: WORKER_AUTOMATIC_DISPATCH_ENABLED
        value: "true"
      # Test checkout is an operator-controlled gate. Render already holds the
      # test-only Stripe credentials, and the source adapter rejects live keys.
      # Preserve the dashboard value instead of silently closing checkout on a
      # later Blueprint sync.
      - key: PAYMENTS_ENABLED
        sync: false
      - key: PUBLIC_PAYMENTS_APPROVED
        value: "false"
      - key: PAYMENT_ACCOUNT_VERIFIED
        value: "false"
      - key: REFUND_PROCESS_READY
        value: "false"

databases:
  - name: homle-marketplace-staging-db
    plan: basic_256mb
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: homle_marketplace_homle_staging
    user: homle_migration_owner
    ipAllowList: []
