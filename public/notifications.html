<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#d7182a" />
  <title>Updates | Homle</title>
  <link rel="icon" href="/homle-logo.png" type="image/png">
  <link rel="stylesheet" href="/homle-tokens.css?v=20260728-2">
  <link rel="stylesheet" href="/styles.css?v=20260728-3">
  <link rel="stylesheet" href="/noncleaner-scroll.css?v=20260814-1">
  <!-- The shared workspace shell and components, last so they win without
       !important over the older rules in styles.css. -->
  <link rel="stylesheet" href="/homle-workspace.css?v=20260831-1">
  <link rel="stylesheet" href="/notifications.css?v=20260830-1">
  <script src="/notifications.js?v=20260830-1" type="module"></script>
</head>
<!-- The shell — sidebar, top bar and phone tab bar — is rendered by
     workspace-shell.js rather than written out here, so there is one
     implementation of it rather than one per page. -->
<body class="homle-workspace notifications-page">
  <a class="skip-link" href="#notifications-main">Skip to updates</a>
  <main id="notifications-main" data-workspace-main>
    <section class="hw-state" data-notification-gate role="status" aria-live="polite">
      <span aria-hidden="true">i</span>
      <div>
        <strong data-notification-gate-title>Checking your private updates…</strong>
        <p data-notification-gate-copy>Only updates for your signed-in account can appear here.</p>
        <div>
          <a class="button" href="/login?intent=book" data-notification-sign-in hidden>Sign in</a>
          <button class="button button-outline" type="button" data-notification-retry hidden>Try again</button>
        </div>
      </div>
    </section>

    <div class="hw-skeleton" data-notification-skeleton aria-hidden="true">
      <div class="hw-skeleton-row"></div>
      <div class="hw-skeleton-row"></div>
      <div class="hw-skeleton-row"></div>
    </div>

    <div data-notification-content hidden>
      <div class="notification-toolbar">
        <p class="notification-summary" aria-live="polite"><strong data-unread-count>0 unread</strong><span>Private to your Homle account</span></p>
        <button class="button button-outline" type="button" data-mark-all-read disabled>Mark all read</button>
      </div>
      <div class="notification-groups" data-notification-list></div>
      <section class="hw-empty" data-notification-empty hidden>
        <span class="hw-empty-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg>
        </span>
        <strong>You are all caught up.</strong>
        <p>Booking requests, arrival, cleaning progress and messages appear here the moment they happen.</p>
        <a class="button" href="/landlord/home" data-empty-workspace-link>Back to your workspace</a>
      </section>
      <div class="hw-feedback" data-notification-feedback role="status" aria-live="polite" tabindex="-1" hidden></div>
      <div class="hw-actions notification-more">
        <button class="button button-outline" type="button" data-load-more hidden>Load earlier updates</button>
      </div>
    </div>
  </main>
</body>
</html>
