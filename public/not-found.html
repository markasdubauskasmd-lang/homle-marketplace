<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#d7182a" />
  <title>Page not found | Homle</title>
  <link rel="icon" href="/homle-logo.png" type="image/png">
  <link rel="stylesheet" href="/homle-tokens.css?v=20260830-1">
  <link rel="stylesheet" href="/styles.css?v=20260830-1">
  <link rel="stylesheet" href="/noncleaner-scroll.css?v=20260814-1">
  <link rel="stylesheet" href="/homle-workspace.css?v=20260830-1">
  <link rel="stylesheet" href="/not-found.css?v=20260830-1">
  <script src="/not-found.js?v=20260830-1" type="module"></script>
</head>
<!-- Until this page existed, every mistyped URL, stale bookmark and expired
     share link in the product returned `{"ok":false,"error":"Not found."}` as
     application/json — which a browser renders as unstyled Times New Roman on
     white, with no way back into Homle. -->
<body class="homle-workspace not-found-page">
  <a class="skip-link" href="#not-found-main">Skip to content</a>
  <main class="not-found-main" id="not-found-main" tabindex="-1">
    <div class="not-found-card">
      <a class="not-found-brand" href="/" aria-label="Homle home">
        <img src="/homle-logo.png" alt="" width="44" height="44">
        <span>Homle</span>
      </a>
      <p class="hw-section-title">Error 404</p>
      <h1>This page is not here.</h1>
      <p class="not-found-lead">The address may have changed, or the link may have expired. Nothing about your account, properties or bookings has been affected.</p>
      <div class="hw-actions">
        <!-- Resolved by not-found.js from the signed-in account, so a Landlord
             is offered their workspace and a visitor is offered the way in. -->
        <a class="button" href="/" data-not-found-primary>Go to Homle</a>
        <button class="button button-outline" type="button" data-not-found-back>Go back</button>
      </div>
      <p class="hw-hint not-found-help">Still stuck? <a href="/landlord/help" data-not-found-help>Ask Homle for help</a>.</p>
    </div>
  </main>
</body>
</html>
